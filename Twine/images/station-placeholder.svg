<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Orbital station placeholder</title>
  <desc id="description">A stylized space station above the blue edge of a moon.</desc>
  <defs>
    <radialGradient id="space" cx="65%" cy="30%" r="85%">
      <stop offset="0" stop-color="#172a55"/>
      <stop offset="0.48" stop-color="#080e22"/>
      <stop offset="1" stop-color="#02040c"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96ddff"/>
      <stop offset="0.12" stop-color="#3477b4"/>
      <stop offset="1" stop-color="#091a3a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea1ba"/>
      <stop offset="0.45" stop-color="#29374d"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <g fill="#d8e8ff" opacity="0.8">
    <circle cx="120" cy="130" r="2"/><circle cx="310" cy="250" r="1.5"/>
    <circle cx="470" cy="90" r="2"/><circle cx="690" cy="185" r="1"/>
    <circle cx="940" cy="95" r="1.5"/><circle cx="1180" cy="170" r="2"/>
    <circle cx="1420" cy="80" r="1"/><circle cx="1510" cy="300" r="2"/>
    <circle cx="210" cy="470" r="1"/><circle cx="1330" cy="420" r="1.5"/>
  </g>
  <ellipse cx="800" cy="1120" rx="980" ry="500" fill="url(#moon)"/>
  <ellipse cx="800" cy="760" rx="760" ry="95" fill="#73c9ff" opacity="0.32" filter="url(#glow)"/>
  <g transform="translate(930 330) rotate(-8)">
    <rect x="-235" y="-33" width="470" height="66" rx="18" fill="url(#metal)"/>
    <rect x="-48" y="-84" width="96" height="168" rx="16" fill="#43546e"/>
    <circle r="58" fill="#182337" stroke="#a8bad0" stroke-width="9"/>
    <circle r="24" fill="#d9f4ff" opacity="0.85"/>
    <rect x="-405" y="-13" width="170" height="26" rx="8" fill="#6f829e"/>
    <rect x="235" y="-13" width="170" height="26" rx="8" fill="#6f829e"/>
    <g fill="#172c56" stroke="#5c8bc5" stroke-width="4">
      <rect x="-560" y="-82" width="155" height="138"/>
      <rect x="405" y="-82" width="155" height="138"/>
    </g>
    <g fill="#9fdfff">
      <circle cx="-160" cy="0" r="6"/><circle cx="-110" cy="0" r="6"/>
      <circle cx="110" cy="0" r="6"/><circle cx="160" cy="0" r="6"/>
    </g>
  </g>
</svg>
